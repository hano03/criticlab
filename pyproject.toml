[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "criticlab"
version = "0.0.1"
description = "Clean single-file deep RL algorithms with built-in critic diagnostics"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.2",
    "gymnasium[mujoco]>=1.0",
    "tyro>=0.8",
    "tensorboard>=2.14",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["criticlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
